<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="sZMXdHBrm5QPgx7P8StA2u9sftCW36DvU3SZlxO-6q0" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주식 물타기 계산기 · 코인 청산 맵 | TradeMath</title>
<meta name="description" content="주식 물타기 계산기, 평단가 계산기, 코인 청산가·펀딩비 계산기와 실시간 청산 맵. 목표 평단까지 몇 주를 더 사야 하는지, 분할 매수 계획까지 무료로 계산하세요.">
<meta property="og:title" content="TradeMath · 주식 물타기 계산기 · 코인 청산 맵">
<meta property="og:description" content="목표 평단까지 필요한 수량, 분할 매수 플래너, 코인 청산가·펀딩비 계산기와 실시간 청산 맵.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C6F432'/%3E%3Ctext x='32' y='42' font-family='Arial' font-weight='900' font-size='26' text-anchor='middle' fill='%230A0D04'%3ETM%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700;800&family=Black+Han+Sans&family=Onest:wght@400;500;600;700&family=Gothic+A1:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0;background:#07090D}
*{box-sizing:border-box}
::selection{background:#C6F432;color:#0A0D04}
a{color:#C6F432;text-decoration:none}a:hover{color:#E2FF7A}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #C6F432;outline-offset:3px}
.fh{font-family:var(--fh,'Hahmlet',serif);font-weight:var(--hw,800);font-synthesis:none}
.fb{font-family:var(--fb,'IBM Plex Sans KR',system-ui,sans-serif)}
.fn{font-family:var(--fn,'JetBrains Mono',monospace);font-variant-numeric:tabular-nums lining-nums;font-synthesis:none}
.field{transition:border-color .2s, box-shadow .2s}
.field:focus-within{border-color:#C6F432 !important;box-shadow:0 0 0 3px rgba(198,244,50,.18)}
.field input:focus{outline:none}
summary{list-style:none}summary::-webkit-details-marker{display:none}
details[open] summary .plus{transform:rotate(45deg)}
.plus{transition:transform .25s}
.grip{cursor:ew-resize;touch-action:none;user-select:none;transition:background .2s,color .2s}
.grip:hover,.grip.dragging{background:#141A23;color:#C6F432 !important}
.field.flash{border-color:#C6F432 !important}
.card{transition:transform .35s cubic-bezier(.2,.8,.2,1), border-color .35s, background .35s}
.card:hover{transform:translateY(-6px);border-color:#C6F432 !important;background:#11161E !important}
.card:hover .arrow{background:#C6F432 !important;color:#0A0D04 !important;transform:rotate(-45deg)}
.arrow{transition:transform .35s, background .35s, color .35s}
.navlink:hover{background:#141A23 !important}
.cta{transition:transform .2s, box-shadow .2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 30px -10px rgba(198,244,50,.6)}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.marq:hover{animation-play-state:paused}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.rise,.marq,.blink{animation:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div class="fb" style="--fh: {{fh}}; --fb: {{fb}}; --fn: {{fn}}; --hw: {{hw}}; min-height: 100vh; background: #07090D; color: #EEF1F4; line-height: 1.55; overflow: hidden">

<div role="region" aria-label="{{tk.aria}}" style="display: flex; align-items: stretch; border-bottom: 1px solid #1C222C; background: #0B0E13">
<div class="fn" style="flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-right: 1px solid #1C222C; background: #07090D; font-size: 12px; letter-spacing: 0.06em; color: #8E99A8; white-space: nowrap">
<span class="blink" style="width: 7px; height: 7px; border-radius: 50%; background: #C6F432; animation: blink 1.6s ease-in-out infinite"></span>{{tk.label}}
</div>
<div style="flex: 1; min-width: 0; overflow: hidden; white-space: nowrap">
<div class="marq fn" style="display: inline-flex; animation: marquee 50s linear infinite; font-size: 14px">
<div style="display: inline-flex; align-items: center; gap: 30px; padding: 12px 15px">
<sc-for list="{{tk.items}}" as="p" hint-placeholder-count="11">
<span style="display: inline-flex; align-items: baseline; gap: 8px"><span aria-hidden="true" class="fn" style="align-self: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: {{p.bg}}; color: #0A0D04; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; letter-spacing: -0.02em; position: relative; overflow: hidden">{{p.ini}}<sc-if value="{{p.hasIcon}}" hint-placeholder-val="{{ false }}"><img src="{{p.icon}}" alt="" onerror="this.remove()" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0A0D12"></sc-if></span><b style="color: #EEF1F4; font-weight: 700">{{p.sym}}</b><span style="color: #C9D0D8">{{p.price}}</span><span style="color: {{p.color}}; font-weight: 700">{{p.chg}}</span><span style="color: #3A4352">/</span></span>
</sc-for>
</div>
<div aria-hidden="true" style="display: inline-flex; align-items: center; gap: 30px; padding: 12px 15px">
<sc-for list="{{tk.items}}" as="p" hint-placeholder-count="11">
<span style="display: inline-flex; align-items: baseline; gap: 8px"><span aria-hidden="true" class="fn" style="align-self: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: {{p.bg}}; color: #0A0D04; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; letter-spacing: -0.02em; position: relative; overflow: hidden">{{p.ini}}<sc-if value="{{p.hasIcon}}" hint-placeholder-val="{{ false }}"><img src="{{p.icon}}" alt="" onerror="this.remove()" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #0A0D12"></sc-if></span><b style="color: #EEF1F4; font-weight: 700">{{p.sym}}</b><span style="color: #C9D0D8">{{p.price}}</span><span style="color: {{p.color}}; font-weight: 700">{{p.chg}}</span><span style="color: #3A4352">/</span></span>
</sc-for>
</div>
</div>
</div>
</div>

<header style="position: relative; z-index: 2; border-bottom: 1px solid #1C222C; background: rgba(7,9,13,0.85)">
<div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<button type="button" onClick="{{goHome}}" style="display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: transparent; color: #EEF1F4; cursor: pointer">
<span class="fn" style="width: 36px; height: 36px; border-radius: 9px; background: #C6F432; color: #0A0D04; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; letter-spacing: -0.04em">TM</span>
<span class="fh" style="font-size: 21px; letter-spacing: -0.02em">{{t.brand}}</span>
</button>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px">
<button type="button" class="navlink" onClick="{{goTools}}" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #C9D0D8; font-size: 15px; cursor: pointer">{{t.navTools}}</button>
<button type="button" class="navlink" onClick="{{goReport}}" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #C9D0D8; font-size: 15px; cursor: pointer">{{t.navReport}}</button>
<button type="button" class="navlink" onClick="{{goLiq}}" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #C9D0D8; font-size: 15px; cursor: pointer">{{t.navLiq}}</button>
<button type="button" class="navlink" onClick="{{goInd}}" style="min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #C9D0D8; font-size: 15px; cursor: pointer">{{t.navInd}}</button>
<div role="group" aria-label="Language" style="margin-left: 6px; display: flex; padding: 3px; gap: 2px; border-radius: 999px; border: 1px solid #252D39">
<button type="button" onClick="{{setKo}}" aria-pressed="{{koPressed}}" class="fn" style="min-height: 38px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: {{koBg}}; color: {{koFg}}; font-size: 13px; font-weight: 700; cursor: pointer">KO</button>
<button type="button" onClick="{{setEn}}" aria-pressed="{{enPressed}}" class="fn" style="min-height: 38px; min-width: 44px; padding: 0 12px; border: 0; border-radius: 999px; background: {{enBg}}; color: {{enFg}}; font-size: 13px; font-weight: 700; cursor: pointer">EN</button>
</div>
<button type="button" class="cta" onClick="{{goHome}}" style="margin-left: 6px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #C6F432; color: #0A0D04; font-weight: 700; font-size: 15px; cursor: pointer">{{t.cta}}</button>
</nav>
</div>
</header>

<main id="top">
<section style="position: relative; background-color: #07090D; background-image: radial-gradient(circle at 1px 1px, rgba(238,241,244,0.07) 1px, transparent 0), radial-gradient(ellipse 60% 55% at 85% 20%, rgba(198,244,50,0.10), transparent 70%); background-size: 28px 28px, 100% 100%">
<div style="max-width: 1240px; margin: 0 auto; padding: 80px 24px 96px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">

<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 26px; padding-top: 8px">
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<p class="rise fn" style="margin: 0; display: inline-flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 0.1em; color: #C6F432">
<span class="blink" style="width: 8px; height: 8px; border-radius: 50%; background: #C6F432; animation: blink 1.6s ease-in-out infinite"></span>{{t.eyebrow}}</p>
<h1 class="rise fh" style="margin: 0; font-size: 66px; line-height: 1.12; letter-spacing: -0.035em; text-wrap: balance; animation-delay: .08s">{{t.h1a}}<br>{{t.h1b}}<br>{{t.h1c}}<br><span style="position: relative; color: #C6F432">{{t.h1acc}}<svg width="100%" height="14" viewBox="0 0 200 14" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; bottom: -8px"><path d="M2 10 C 50 2, 120 2, 198 8" fill="none" stroke="#C6F432" stroke-width="4" stroke-linecap="round"></path></svg></span>{{t.h1tail}}</h1>
<p class="rise" style="margin: 0; font-size: 18px; color: #A9B3BF; max-width: 480px; text-wrap: pretty; animation-delay: .16s">{{t.sub}}</p>
<div class="rise" style="display: flex; flex-wrap: wrap; gap: 10px; animation-delay: .24s">
<sc-for list="{{t.chips}}" as="c" hint-placeholder-count="3">
<span class="fn" style="padding: 8px 14px; border: 1px solid #252D39; border-radius: 999px; font-size: 13px; color: #C9D0D8">{{c}}</span>
</sc-for>
</div>
<div class="rise" style="display: flex; flex-wrap: wrap; align-items: center; gap: 18px; animation-delay: .32s">
<button type="button" class="cta" onClick="{{goTools}}" style="min-height: 52px; padding: 0 26px; display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; background: #C6F432; color: #0A0D04; font-weight: 700; font-size: 16px; cursor: pointer">{{t.heroCta}}<span aria-hidden="true">→</span></button>
<button type="button" onClick="{{goReport}}" style="padding: 0 0 2px; border: 0; border-bottom: 1px solid #3A4352; background: transparent; font-size: 15px; font-weight: 600; color: #EEF1F4; cursor: pointer">{{t.heroLink}}</button>
</div>
</sc-if>
<sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{goHome}}" class="fn" style="align-self: flex-start; min-height: 40px; padding: 0 14px; border: 1px solid #252D39; border-radius: 999px; background: transparent; color: #C9D0D8; font-size: 13px; cursor: pointer">{{t.back}}</button>
<p class="fn" style="margin: 0; font-size: 13px; letter-spacing: 0.12em; color: #C6F432">{{calc.num}} · {{calc.code}}</p>
<h1 class="fh" style="margin: 0; font-size: 56px; line-height: 1.12; letter-spacing: -0.035em; text-wrap: balance">{{calc.title}}</h1>
<p style="margin: 0; font-size: 18px; color: #A9B3BF; max-width: 500px; text-wrap: pretty">{{calc.desc}}</p>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 22px 24px; border-radius: 16px; background: #0B0E13; border: 1px solid #1C222C">
<span class="fn" style="font-size: 12px; letter-spacing: 0.14em; color: #8E99A8">{{t.howTitle}}</span>
<sc-for list="{{calc.formula}}" as="line" hint-placeholder-count="2">
<p class="fn" style="margin: 0; font-size: 14px; color: #EEF1F4">{{line}}</p>
</sc-for>
</div>
</sc-if>
</div>

<div class="rise" style="flex: 1 1 560px; min-width: 0; position: relative; animation-delay: .2s">
<div aria-hidden="true" style="position: absolute; inset: 24px -18px -18px 24px; border: 1px solid #1C222C; border-radius: 26px"></div>
<div style="position: relative; background: linear-gradient(180deg, #121821 0%, #0C1016 100%); border: 1px solid #252D39; border-radius: 24px; padding: 28px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 40px 80px -30px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05)">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span class="fn" style="font-size: 12px; letter-spacing: 0.14em; color: #8E99A8">{{calc.code}}</span>
<h2 class="fh" style="margin: 0; font-size: 24px; letter-spacing: -0.02em">{{calc.title}}</h2>
</div>
<sc-if value="{{calc.hasSide}}" hint-placeholder-val="{{ true }}">
<div role="group" aria-label="{{t.sideLabel}}" style="display: flex; padding: 4px; gap: 4px; border-radius: 999px; background: #07090D; border: 1px solid #252D39">
<button type="button" onClick="{{pickLong}}" aria-pressed="{{longPressed}}" style="min-height: 44px; min-width: 76px; padding: 0 18px; border-radius: 999px; border: 0; background: {{longBg}}; color: {{longFg}}; font-weight: 700; cursor: pointer">{{t.long}}</button>
<button type="button" onClick="{{pickShort}}" aria-pressed="{{shortPressed}}" style="min-height: 44px; min-width: 76px; padding: 0 18px; border-radius: 999px; border: 0; background: {{shortBg}}; color: {{shortFg}}; font-weight: 700; cursor: pointer">{{t.short}}</button>
</div>
</sc-if>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 12px">
<sc-for list="{{calc.fields}}" as="fd" hint-placeholder-count="6">
<label style="flex: 1 1 210px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #8E99A8">{{fd.label}}
<span class="field" data-scrub-key="{{fd.key}}" title="{{t.scrubTip}}" style="display: flex; align-items: center; gap: 8px; min-height: 50px; padding: 0 14px 0 6px; border-radius: 12px; border: 1px solid #252D39; background: #07090D">
<span class="grip" data-drag-key="{{fd.key}}" aria-hidden="true" style="flex: none; width: 30px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #5A6575"><svg width="18" height="12" viewBox="0 0 18 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2L1 6l4 4"></path><path d="M13 2l4 4-4 4"></path><path d="M7 6h4"></path></svg></span>
<input class="fn" type="text" inputmode="decimal" value="{{fd.value}}" onChange="{{fd.onChange}}" onKeyDown="{{fd.onKeyDown}}" aria-describedby="scrub-hint" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #EEF1F4; font-size: 18px; font-weight: 700">
<span class="fn" style="font-size: 12px; color: #8E99A8">{{fd.unit}}</span>
</span>
</label>
</sc-for>
</div>
<p id="scrub-hint" style="margin: -8px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 12px; color: #8E99A8">
<span style="display: inline-flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#C6F432" stroke-width="1.6" aria-hidden="true"><rect x="3.5" y="1" width="7" height="12" rx="3.5"></rect><path d="M7 3.5v2"></path></svg>{{t.hintWheel}}</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="10" viewBox="0 0 18 12" fill="none" stroke="#C6F432" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 2L1 6l4 4"></path><path d="M13 2l4 4-4 4"></path></svg>{{t.hintDrag}}</span>
<span>{{t.hintKeys}}</span>
</p>

<sc-if value="{{res.hasError}}" hint-placeholder-val="{{ false }}">
<p role="alert" style="margin: 0; padding: 12px 16px; border-radius: 12px; background: rgba(255,138,76,0.08); border: 1px solid rgba(255,138,76,0.5); color: #FF9F6B; font-size: 14px">{{res.error}}</p>
</sc-if>

<sc-if value="{{res.ok}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<div style="flex: 2 1 260px; padding: 18px 20px; border-radius: 16px; background: #C6F432; color: #0A0D04; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 600">{{res.p.label}}</span>
<span class="fn" style="font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.03em; overflow-wrap: anywhere">{{res.p.value}}</span>
<span class="fn" style="font-size: 13px; font-weight: 500">{{res.p.sub}}</span>
</div>
<div style="flex: 1 1 160px; padding: 18px 20px; border-radius: 16px; border: 1px solid #252D39; background: #07090D; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #8E99A8">{{res.s.label}}</span>
<span class="fn" style="font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.03em; overflow-wrap: anywhere">{{res.s.value}}</span>
<span class="fn" style="font-size: 13px; color: #8E99A8">{{res.s.sub}}</span>
</div>
</div>

<sc-if value="{{viz.hasLadder}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px 16px; border-radius: 16px; border: 1px solid #1C222C; background: #0A0D12">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px">
<span class="fn" style="font-size: 12px; letter-spacing: 0.14em; color: #8E99A8">PRICE LADDER</span>
<span style="font-size: 12px; color: #8E99A8">{{t.lowHigh}}</span>
</div>
<div role="img" aria-label="{{t.ladderAria}}" style="position: relative; height: 44px">
<div style="position: absolute; left: 0; right: 0; top: 21px; height: 2px; background: #252D39"></div>
<sc-for list="{{viz.zones}}" as="z" hint-placeholder-count="2">
<div style="position: absolute; top: 14px; height: 16px; border-radius: 4px; left: {{z.l}}; width: {{z.w}}; background: {{z.color}}"></div>
</sc-for>
<sc-for list="{{viz.markers}}" as="mk" hint-placeholder-count="4">
<div style="position: absolute; border-radius: 2px; left: {{mk.l}}; top: {{mk.top}}; height: {{mk.h}}; width: {{mk.wd}}; margin-left: {{mk.ml}}; background: {{mk.bg}}"></div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 18px">
<sc-for list="{{viz.legend}}" as="lg" hint-placeholder-count="4">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #A9B3BF">
<sc-if value="{{lg.dash}}" hint-placeholder-val="{{ false }}"><span style="width: 10px; border-top: 2px dashed #EEF1F4"></span></sc-if>
<sc-if value="{{lg.solid}}" hint-placeholder-val="{{ true }}"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{lg.color}}"></span></sc-if>
{{lg.label}} <b class="fn" style="color: {{lg.color}}">{{lg.value}}</b></span>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{viz.hasBars}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border-radius: 16px; border: 1px solid #1C222C; background: #0A0D12">
<span class="fn" style="font-size: 12px; letter-spacing: 0.1em; color: #8E99A8">{{viz.barsTitle}}</span>
<sc-for list="{{viz.bars}}" as="b" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px">
<span style="color: #A9B3BF">{{b.label}}</span>
<span class="fn" style="font-weight: 700; color: {{b.color}}">{{b.value}}</span>
</div>
<div style="height: 8px; border-radius: 999px; background: #161C25; overflow: hidden">
<div style="height: 100%; border-radius: 999px; width: {{b.w}}; background: {{b.color}}; transition: width .35s cubic-bezier(.2,.8,.2,1)"></div>
</div>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{viz.insGood}}" hint-placeholder-val="{{ true }}">

  compute(id, v, isLong, L, r, fmt) {
    var N = function (x) { if (x === '' || x == null) return NaN; return parseFloat(String(x).replace(/,/g, '')); };
    var sg = function (x, d) { return (x > 0 ? '+' : x < 0 ? '−' : '') + fmt(Math.abs(x), d); };
    var fin = function (a) { for (var i = 0; i < a.length; i++) { if (!isFinite(a[i])) return false; } return true; };
    var err = function (m) { return { ok: false, error: m }; };
    var liqOf = function (e, lev, mmr, long) { return Math.max(0, long ? e * (1 - 1 / lev + mmr) : e * (1 + 1 / lev - mmr)); };
    var rowsOf = function () {
      var out = [];
      for (var i = 1; i <= 4; i++) {
        var p = N(v['p' + i]), q = N(v['q' + i]);
        var pe = v['p' + i] === '' || v['p' + i] == null, qe = v['q' + i] === '' || v['q' + i] == null;
        if (pe && qe) continue;
        if (!isFinite(p) || !isFinite(q) || p <= 0 || q <= 0) return null;
        out.push([p, q]);
      }
      return out;
    };
    if (id === 'pos') {
      var seed = N(v.seed), risk = N(v.risk), entry = N(v.entry), stop = N(v.stop), margin = N(v.margin), fee = N(v.fee);
      if (!fin([seed, risk, entry, stop, margin, fee])) return err(L.errNum);
      if (seed <= 0 || risk <= 0 || entry <= 0 || stop <= 0 || margin <= 0 || fee < 0) return err(L.errPos);
      if (isLong && stop >= entry) return err(L.errLongStop);
      if (!isLong && stop <= entry) return err(L.errShortStop);
      var dist = Math.abs(entry - stop) / entry, riskAmt = seed * risk / 100;
      var notional = riskAmt / (dist + 2 * fee / 100), qty = notional / entry;
      var lev = Math.max(1, Math.ceil(notional / margin));
      var liq = liqOf(entry, lev, 0.005, isLong);
      var target = isLong ? entry + 2 * (entry - stop) : entry - 2 * (stop - entry);
      var lo = Math.min(liq, stop, entry, target), hi = Math.max(liq, stop, entry, target);
      var pad = (hi - lo) * 0.06 || entry * 0.01; lo -= pad; hi += pad;
      var span = hi - lo;
      var pc = function (x) { return Math.max(0, Math.min(100, x)).toFixed(2) + '%'; };
      var at = function (x) { return pc((x - lo) / span * 100); };
      return {
        ok: true,
        p: { label: r.p, value: fmt(qty, 6), sub: L.pos + ' ' + fmt(notional) + ' USDT' },
        s: { label: r.s, value: lev + 'x', sub: L.stopDist + ' ' + fmt(dist * 100) + '%' },
        list: [{ label: r.loss, value: '−' + fmt(riskAmt) + ' USDT' }, { label: r.target, value: fmt(target) }, { label: r.liq, value: fmt(liq) }],
        safe: isLong ? liq < stop : liq > stop,
        lad: { lossL: at(Math.min(entry, stop)), lossW: pc(Math.abs(entry - stop) / span * 100), gainL: at(Math.min(entry, target)), gainW: pc(Math.abs(target - entry) / span * 100),
          liqP: at(liq), stopP: at(stop), entryP: at(entry), targetP: at(target), liq: fmt(liq), stop: fmt(stop), entry: fmt(entry), target: fmt(target) }
      };
    }
    if (id === 'fee') {
      var m = N(v.margin), lv = N(v.lev), en = N(v.entry), ex = N(v.exit), fo = N(v.fo), fc = N(v.fc);
      if (!fin([m, lv, en, ex, fo, fc])) return err(L.errNum);
      if (m <= 0 || en <= 0 || ex <= 0 || fo < 0 || fc < 0) return err(L.errPos);
      if (lv < 1 || lv > 125) return err(L.errLev);
      var nt = m * lv, q2 = nt / en, of = nt * fo / 100, cf = q2 * ex * fc / 100;
      var gross = isLong ? q2 * (ex - en) : q2 * (en - ex), tot = of + cf, net = gross - tot;
      var be = isLong ? en * (1 + fo / 100) / (1 - fc / 100) : en * (1 - fo / 100) / (1 + fc / 100);
      return { ok: true,
        p: { label: r.p, value: sg(net) + ' USDT', sub: L.roe + ' ' + sg(net / m * 100) + '%' },
        s: { label: r.s, value: fmt(tot), sub: L.ofMargin + ' ' + fmt(tot / m * 100) + '%' },
        list: [{ label: r.notional, value: fmt(nt) + ' USDT' }, { label: r.open, value: fmt(of, 4) + ' USDT' }, { label: r.close, value: fmt(cf, 4) + ' USDT' }, { label: r.gross, value: sg(gross) + ' USDT' }, { label: r.be, value: fmt(be) }] };
    }
    if (id === 'liq' || id === 'sliq') {
      var e2 = N(v.entry), l2 = N(v.lev), mm = N(v.mmr) / 100;
      if (!fin([e2, l2, mm])) return err(L.errNum);
      if (e2 <= 0) return err(L.errPos);
      if (l2 < 1 || l2 > 125) return err(L.errLev);
      if (mm < 0 || mm >= 1 / l2) return err(L.errMmr);
      return { ok: true, p: { label: r.p, value: fmt(liqOf(e2, l2, mm, isLong)), sub: '' }, s: { label: r.s, value: (isLong ? '−' : '+') + fmt((1 / l2 - mm) * 100) + '%', sub: '' }, list: [] };
    }
    if (id === 'fund') {
      var n3 = N(v.notional), rt = N(v.rate), iv = N(v.interval), hd = N(v.hold);
      if (!fin([n3, rt, iv, hd])) return err(L.errNum);
      if (n3 <= 0 || iv <= 0 || hd < 0) return err(L.errPos);
      var cnt = Math.floor(hd / iv), per = n3 * rt / 100, amt = (isLong ? -1 : 1) * per * cnt;
      return { ok: true,
        p: { label: r.p, value: sg(amt) + ' USDT', sub: amt < 0 ? L.pay : amt > 0 ? L.receive : '' },
        s: { label: r.s, value: cnt + L.times, sub: '' },
        list: [{ label: r.per, value: fmt(Math.abs(per), 4) + ' USDT' }, { label: r.apr, value: sg(rt * (24 / iv) * 365) + '%' }] };
    }
    if (id === 'dca') {
      var rs = rowsOf(), l4 = N(v.lev);
      if (rs === null) return err(L.errRows);
      if (!rs.length || !isFinite(l4)) return err(L.errNum);
      if (l4 < 1 || l4 > 125) return err(L.errLev);
      var sq = 0, spq = 0;
      for (var i = 0; i < rs.length; i++) { sq += rs[i][1]; spq += rs[i][0] * rs[i][1]; }
      var avg = spq / sq;
      return { ok: true, p: { label: r.p, value: fmt(avg), sub: '' }, s: { label: r.s, value: fmt(liqOf(avg, l4, 0.005, isLong)), sub: '' },
        list: [{ label: r.qty, value: fmt(sq, 6) }, { label: r.notional, value: fmt(spq) + ' USDT' }, { label: r.margin, value: fmt(spq / l4) + ' USDT' }] };
    }
    if (id === 'rr') {
      var e5 = N(v.entry), s5 = N(v.stop), t5 = N(v.target);
      if (!fin([e5, s5, t5])) return err(L.errNum);
      if (e5 <= 0 || s5 <= 0 || t5 <= 0) return err(L.errPos);
      if (isLong && !(s5 < e5 && e5 < t5)) return err(L.errRRLong);
      if (!isLong && !(t5 < e5 && e5 < s5)) return err(L.errRRShort);
      var rk = Math.abs(e5 - s5) / e5, rw = Math.abs(t5 - e5) / e5, R = rw / rk;
      return { ok: true, p: { label: r.p, value: '1 : ' + fmt(R, 2), sub: '' }, s: { label: r.s, value: fmt(100 / (1 + R), 1) + '%', sub: '' },
        list: [{ label: r.risk, value: '−' + fmt(rk * 100) + '%' }, { label: r.reward, value: '+' + fmt(rw * 100) + '%' }] };
    }
    if (id === 'avgdown') {
      var sh = N(v.shares), av = N(v.avg), px = N(v.price), tg = N(v.target);
      if (!fin([sh, av, px, tg])) return err(L.errNum);
      if (sh <= 0 || av <= 0 || px <= 0 || tg <= 0) return err(L.errPos);
      if (!(px < tg && tg < av)) return err(L.errAvgDown);
      var need = Math.ceil(sh * (av - tg) / (tg - px)), cost = need * px;
      return { ok: true, p: { label: r.p, value: fmt(need, 0) + L.sh, sub: '' }, s: { label: r.s, value: fmt(cost, 0), sub: '' },
        list: [{ label: r.newAvg, value: fmt((sh * av + cost) / (sh + need)) }, { label: r.total, value: fmt(sh + need, 0) + L.sh }, { label: r.invested, value: fmt(sh * av + cost, 0) }] };
    }
    if (id === 'avgp') {
      var rs2 = rowsOf(), cp = N(v.cp);
      if (rs2 === null) return err(L.errRows);
      if (!rs2.length || !isFinite(cp)) return err(L.errNum);
      if (cp <= 0) return err(L.errPos);
      var q7 = 0, c7 = 0;
      for (var j = 0; j < rs2.length; j++) { q7 += rs2[j][1]; c7 += rs2[j][0] * rs2[j][1]; }
      var a7 = c7 / q7, val = q7 * cp;
      return { ok: true, p: { label: r.p, value: fmt(a7), sub: '' }, s: { label: r.s, value: sg((cp - a7) / a7 * 100) + '%', sub: '' },
        list: [{ label: r.qty, value: fmt(q7, 4) }, { label: r.cost, value: fmt(c7, 0) }, { label: r.value, value: fmt(val, 0) }, { label: r.pl, value: sg(val - c7, 0) }] };
    }
    if (id === 'etf') {
      var L8 = N(v.lev), vo = N(v.vol) / 100, dy = N(v.days);
      if (!fin([L8, vo, dy])) return err(L.errNum);
      if (L8 < 1 || vo <= 0 || dy < 1) return err(L.errPos);
      if (L8 * vo >= 1) return err(L.errEtf);
      var ix = 1, et = 1, nd = Math.min(Math.floor(dy), 5000);
      for (var k = 0; k < nd; k++) { var d = k % 2 === 0 ? vo : -vo; ix *= 1 + d; et *= 1 + L8 * d; }
      var ir = (ix - 1) * 100, er = (et - 1) * 100;
      return { ok: true, p: { label: r.p, value: sg(er) + '%', sub: '' }, s: { label: r.s, value: sg(ir) + '%', sub: '' },
        list: [{ label: r.naive, value: sg(ir * L8) + '%' }, { label: r.decay, value: sg(er - ir * L8) + '%p' }] };
    }

  var md = p(d.getUTCMonth() + 1) + '/' + p(d.getUTCDate()), hm = p(d.getUTCHours()) + ':' + p(d.getUTCMinutes());
  return withDate === 'full' ? d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()) + ' ' + hm + ' KST' : md + ' ' + hm + (withDate ? ' KST' : '');

Component.prototype.iconBase = 'https://cdn.jsdelivr.net/npm/cryptocurrency-icons@0.18.1/svg/color/';

function loadMarket() {

    var pi = r[0], tk = r[1], tmap = {};

    });

      .map(function (p) { return [p.symbol.replace(/USDT$/, ''), +p.lastFundingRate, Math.round(+tmap[p.symbol].quoteVolume / 1e6)]; });
    liquid.sort(function (a, b) { return b[1] - a[1]; });

function liqModel(kl, P) {

  for (var i = 0; i < n; i++) {
    var e = (kl[i].h + kl[i].l + kl[i].c) / 3;
    for (var ti = 0; ti < TIERS.length; ti++) {

      for (var t = i + 1; t < n; t++) { if (lh < 0 && kl[t].l <= lp) lh = t; if (sh < 0 && kl[t].h >= sp) sh = t; if (lh >= 0 && sh >= 0) break; }
      if (lh < 0 && P > lp && lp >= lo && lp < hi) L[Math.floor((lp - lo) / bw)] += w;

  var near = function (a, f, to, st) { for (var q = f; q !== to; q += st) if (a[q] >= thr) return q; return -1; };

  var su = near(S, half, NB, 1); if (su < 0) su = am(S, half, NB);
  var ld = near(L, half - 1, -1, -1); if (ld < 0) ld = am(L, 0, half);
  var z = function (b) { if (b < 0) return [P, P, P, 0]; var a = lo + b * bw; return [a, a + bw, a + bw / 2, ((a + bw / 2) - P) / P * 100]; };
  return { up: z(su), dn: z(ld) };
}
function loadLiq() {

}
function connectTicker() {
  var streams = MAJ.map(function (s) { return s.toLowerCase() + 'usdt@ticker'; }).join('/'), ws;

  comp.state.lang = /^ko/i.test(navigator.language || '') ? 'ko' : 'en';
  if (m) comp.state.view = m[1];

    var h = v === 'home' ? '' : '#/' + v;

    });
  });
  window.addEventListener('hashchange', function () { var mm = location.hash.match(/^#\/(\w+)/); if (mm && mm[1] !== comp.state.view) comp.setState({ view: mm[1] }); });
  renderNow();
  if (comp.componentDidMount) comp.componentDidMount();
  setInterval(function () { if (App.dirty) App.schedule(); }, 1000);
  loadMarket(); loadLiq(); connectTicker();
